name: Update stats

on:
  schedule:
    - cron: '0 */3 * * *' # alle 3 Stunden
  workflow_dispatch: # manuell per Button
  push:
    branches: [main]
    paths: [generate.mjs, index.html, .github/workflows/update-stats.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Push mit dem PAT, damit GitHub Pages danach automatisch neu baut
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate stats.svg
        env:
          # PAT mit Repo-Lesezugriff (inkl. privater Repos); Fallback: Standard-Token (nur oeffentlich)
          STATS_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          STATS_LOGIN: ${{ github.repository_owner }}
        run: node generate.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg stats.json
          git diff --cached --quiet || (git commit -m "chore: update stats" && git push)
