name: Update stats

on:
  schedule:
    - cron: '0 * * * *' # hourly
  workflow_dispatch: # manual button
  push:
    branches: [main]
    paths: [theme.json, intro.json, road.json, road-state.json, .github/workflows/update-stats.yml]

permissions:
  contents: write

# never two runs at once (push from the script, schedule, manual start)
concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # push with the PAT so GitHub Pages rebuilds afterwards
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          # always the newest state, not the triggering commit (runs wait in the queue, main has moved on by then)
          ref: main
      - name: Stats, achievements, dashboard and Master Road
        uses: nkunze2306/github-achievements-by-niounze@stable
        with:
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          components: stats,achievements,dashboard,road
          wakatime-key: ${{ secrets.WAKATIME_API_KEY }}
          # HSMW GitLab (the token is stored in GITLAB_COM_TOKEN); only commits with these author e-mails count
          gitlab-sources: '[{"host":"https://git.hs-mittweida.de","token":"${{ secrets.GITLAB_COM_TOKEN }}"}]'
          gitlab-author-emails: 'nkunze923@gmail.com,nkunze1@hs-mittweida.de'
          dashboard-auth-client-id: Ov23linavHFDgDCCIX6E
          dashboard-auth-worker: https://stats-login.nkunze923.workers.dev
          dashboard-visits: 'true'
      - name: Commit and push once
        # Two commits (images first, then the README pinned to them) but ONE push: every push starts a Pages build and the next push cancels
        # the running one, which showed up as a red or grey run every hour. GitHub caches README images (raw CDN and image proxy) and ignores
        # ?v=, a URL with the commit SHA never changes, so it always shows exactly the right state.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pin() {
            for f in stats.svg achievements.svg; do
              [ -f "$f" ] || continue
              url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/$(git log -1 --format=%H -- "$f")/${f}"
              sed -i -E "s#(https://raw\.githubusercontent\.com/[^\"' )]*/)?${f//./\.}(\?v=[0-9a-f]+)?#${url}#g" README.md
            done
            git add README.md
            git diff --cached --quiet || git commit -m "chore: pin README images"
          }
          git add -A
          git diff --cached --quiet || git commit -m "chore: update stats and achievements"
          pin
          for attempt in 1 2 3; do
            git push && exit 0
            # someone pushed in between: in conflicts the freshly generated files win (-X theirs), then pin to the rewritten commits
            git pull --rebase -X theirs
            pin
          done
          git push
