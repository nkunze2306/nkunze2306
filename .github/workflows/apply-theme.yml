name: Apply theme

# "Save & rebuild" auf der Website öffnet ein vorausgefülltes Issue mit dem Titel "theme: …".
# Nur Issues vom Repo-Owner werden übernommen: theme.json committen, stats.svg neu bauen, Issue schließen.
# Issues von allen anderen werden ohne Änderung geschlossen. So ist auf der Website kein Token nötig.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: apply-theme
  cancel-in-progress: false

jobs:
  reject:
    if: startsWith(github.event.issue.title, 'theme:') && github.event.issue.user.login != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Close without changes
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: gh issue close "$NUM" -R "$GITHUB_REPOSITORY" --reason "not planned" --comment "Only the owner can change the theme of this dashboard."

  apply:
    if: startsWith(github.event.issue.title, 'theme:') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write theme.json
        id: write
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: echo "theme=$(node apply-theme.mjs)" >> "$GITHUB_OUTPUT"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme.json
          git diff --cached --quiet || (git commit -m "chore: update theme" && git pull --rebase && git push)
      # Pushes mit dem Standard-Token starten keine Workflows, ein workflow_dispatch schon
      - name: Rebuild stats.svg
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-stats.yml -R "$GITHUB_REPOSITORY" --ref main
      - name: Close issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          OK: ${{ job.status == 'success' }}
          THEME: ${{ steps.write.outputs.theme }}
        run: |
          if [ "$OK" = "true" ]; then
            gh issue close "$NUM" -R "$GITHUB_REPOSITORY" --comment "Applied: \`$THEME\`. stats.svg is being rebuilt now."
          else
            gh issue close "$NUM" -R "$GITHUB_REPOSITORY" --reason "not planned" --comment "Could not apply these settings, see the workflow log."
          fi
